<!DOCTYPE html>
<html lang="it" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <title>Screenshot progress</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 14px;
      background: #151529;
      color: #f7f8ff;
      font-family: "Segoe UI", sans-serif;
    }
    .panel {
      width: 100%;
      padding: 12px 14px 13px;
      border: 1px solid #343653;
      border-radius: 12px;
      background: #202038;
      box-shadow: 0 8px 24px rgba(0,0,0,.28);
    }
    #percent { color: #24d4f5; font-size: 36px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; text-align: center; }
    .track { height: 7px; margin-top: 12px; overflow: hidden; border-radius: 999px; background: #383a53; }
    #bar { width: 0; height: 100%; border-radius: inherit; background: #24d4f5; transition: width .18s linear; }
    #label { margin-top: 9px; color: #aeb2c9; font-size: 11px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body class="notranslate" translate="no">
  <div class="panel">
    <div id="percent">0%</div>
    <div class="track"><div id="bar"></div></div>
    <div id="label">Preparing…</div>
  </div>
  <script src="progress.js"></script>
</body>
</html>
